spring.application.name=cia-state
spring.thymeleaf.cache=false
spring.main.show-banner=false

firebase.database-url=${FIREBASE_DATABASE_URL}
kafka.username=${KAFKA_USERNAME}
kafka.password=${KAFKA_PASSWORD}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.group.id=${KAFKA_GROUP_ID:cia-state}

outbox.enabled=true
outbox.poll-interval-ms=1000
outbox.batch-size=100
outbox.send-timeout-seconds=15

# A bounded synchronous Kafka send and bounded broker delivery timeout.
kafka.producer.max-block-ms=1000
kafka.producer.delivery-timeout-ms=10000
kafka.producer.request-timeout-ms=5000
kafka.producer.linger-ms=0

workflows.stage-timeout-seconds=300
workflows.reconciliation.enabled=true
workflows.reconciliation.poll-interval-ms=1000
workflows.reconciliation.legacy-poll-interval-ms=30000
workflows.reconciliation.batch-size=100
# Outbox, deadline expiry, and legacy discovery must not serialize behind one blocked job.
spring.task.scheduling.pool.size=3
